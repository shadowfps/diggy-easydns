name: Build and publish container

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  # Auch auf Pull Requests, damit der verify-Job VOR dem Merge läuft. Ohne das
  # gatete er nur den Deploy: auf einem PR lief gar kein Check, die Prüfung kam
  # also erst, wenn der Code schon auf main war.
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  MITTWALD_STACK_ID: 86540922-d203-4150-8776-9cc4e22352bd
  MITTWALD_CLI_VERSION: v1.20.2

jobs:
  # Gate vor dem Deploy. Vorher ging jeder Push auf main ungeprüft in
  # Produktion — das einzige Kriterium war, dass `tsc -p tsconfig.server.json`
  # im Docker-Build durchläuft. Client-Typfehler und Lint-Verstöße kamen so
  # unbemerkt ins Image.
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      # Deutsche Texte, die am Übersetzungsmodul vorbeilaufen (#86) —
      # sonst fällt ein vergessener Text erst auf Englisch auf.
      - name: Übersetzung
        run: npm run i18n

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      # Der Client-Build lief bisher nur im Docker-Build, also erst NACH dem
      # Merge. Ein Fehler, den tsc nicht sieht (etwa in der Chunk-Konfiguration
      # von vite.config.ts), fiel damit erst auf main auf.
      - name: Build
        run: npm run build

      # Startet den gebauten Server wie im Container. Die Tests laufen ohne
      # dist/, Teile des Routings entstehen aber erst mit dem Build — der
      # Express-5-PR (#70) war grün und wäre in Produktion nicht gestartet.
      - name: Smoke-Test
        run: npm run smoke

      - name: Bundle-Budget
        run: npm run size

  # Browser-Tests (docs/E2E.md): seitliches Überlaufen aller wichtigen Ansichten
  # hell/dunkel bei 390 und 1440 px, dazu ein Pixelvergleich weniger
  # Referenzbilder. Die API ist dabei durch feste Testdaten ersetzt.
  #
  # Läuft NEBEN verify, publish hängt weiter nur an verify. Gaten soll der Job
  # den PR (als Pflicht-Check neben verify in der Branch-Protection) — dort
  # sollen optische Brüche auffallen. Auf main dagegen soll ein Hotfix nicht
  # an einem Referenzbild hängen, das etwa nach einem Playwright-Update neu
  # erzeugt werden muss. Parallel ist außerdem schneller als hintereinander.
  #
  # ARM-Runner und Docker-Image statt `playwright install` auf ubuntu-latest:
  # Die Referenzbilder entstehen lokal mit demselben `npm run e2e:docker` —
  # gleiches Image (Schriften, Chromium-Build) und gleiche Architektur wie
  # hier, also identische Pixel. Auf x86 rendert Chromium Kanten minimal
  # anders, und amd64-Emulation lässt Chromium in Docker Desktop abstürzen.
  e2e:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 15
    # Nur lesen: der Job veröffentlicht nichts. Ohne diese Zeile erbte er
    # `packages: write` vom Workflow — und `npm ci` im Container führt
    # Install-Skripte fremder Pakete aus, mit dem ganzen Checkout im Zugriff.
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          # Das Token nicht in .git/config ablegen: der Checkout wird komplett
          # in den Container gemountet, und danach braucht kein Schritt mehr Git.
          persist-credentials: false

      # Nur für das Startskript; npm ci und Build laufen im Container.
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1

      - name: E2E-Tests im Playwright-Image
        run: npm run e2e:docker

      # HTML-Report mit erwartetem Bild, Ist-Bild und Diff je Abweichung, dazu
      # die Screenshots fehlgeschlagener Überlauf-Tests.
      - name: Report und Diff-Bilder hochladen
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
          # Beim erneuten Ausführen des Jobs ersetzt der neue Report den alten,
          # statt am bereits vorhandenen Namen zu scheitern.
          overwrite: true

  # Bewusst NICHT blockierend und bewusst getrennt von verify.
  #
  # Ein neu veröffentlichter Advisory würde einen bis dahin grünen Build rot
  # machen, ohne dass sich am Code etwas geändert hat. Das führt dazu, dass man
  # den Job irgendwann ignoriert — und dann taugt er nichts mehr. So bleibt der
  # Zustand sichtbar, ohne den Merge zu blockieren; die eigentliche Arbeit
  # macht Dependabot.
  audit:
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.22.1
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit
        run: npm audit --audit-level=high

  publish:
    needs: verify
    # Auf einem PR nur prüfen, nicht veröffentlichen: ein Image aus einem
    # offenen PR gehört nicht nach GHCR, und der Deploy erst gar nicht.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    outputs:
      # Der Digest macht den Deploy unveränderlich und erzwingt den Rollout,
      # siehe Kommentar im deploy-Job.
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,prefix=sha-
          labels: |
            org.opencontainers.image.title=Diggy
            org.opencontainers.image.description=DNS, SSL and domain audit web application

      - name: Build and push image
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Für die Versionsanzeige (Footer, /api/health) — im Build-Kontext fehlt .git.
          build-args: |
            DIGGY_COMMIT=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

  deploy:
    needs: publish
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install mittwald CLI
        run: |
          curl -fsSL -o mw.tgz "https://github.com/mittwald/cli/releases/download/${MITTWALD_CLI_VERSION}/mw-${MITTWALD_CLI_VERSION}-9b7de74-linux-x64.tar.gz"
          tar -xzf mw.tgz
          echo "$PWD/mw/bin" >> "$GITHUB_PATH"

      - name: Deploy stack to Mittwald
        env:
          MITTWALD_API_TOKEN: ${{ secrets.MITTWALD_API_TOKEN }}
          DIGGY_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.publish.outputs.digest }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SECURE: ${{ secrets.SMTP_SECURE }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          CONTACT_TO: ${{ secrets.CONTACT_TO }}
          CONTACT_FROM: ${{ secrets.CONTACT_FROM }}
          CONTACT_FORM_SECRET: ${{ secrets.CONTACT_FORM_SECRET }}
          PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
          PAGESPEED_API_KEY: ${{ secrets.PAGESPEED_API_KEY }}
          VIRUS_TOTAL_API_KEY: ${{ secrets.VIRUS_TOTAL_API_KEY }}
        run: |
          # Das Image wird per DIGEST referenziert, nicht per `:latest`.
          #
          # Mit `:latest` blieb der Rollout aus: `mw stack deploy` vergleicht
          # die Compose-DEFINITION, und die änderte sich nicht — der Tag-String
          # war identisch. Das Log meldete dann
          # "Deployment successful. No services were restarted.",
          # während der Container weiter das alte Image lief. Der Deploy war
          # also grün, der Code aber nicht draußen.
          #
          # Der Digest ändert sich bei jedem Build, erzwingt damit den Restart
          # und macht den Deploy reproduzierbar: ein Rollback ist ein Deploy
          # mit dem alten Digest.
          #
          # Deklarativer Deploy: mw ersetzt die Stack-Env durch das aufgelöste
          # compose.mittwald.yml. Die dortigen ${VAR} werden aus diesem env-file
          # interpoliert; Werte kommen aus GitHub-Secrets (nichts Geheimes im
          # Repo). NODE_ENV/PORT/TRUST_PROXY stehen fest im compose-File.

          # Schutz gegen versehentliches Leer-Deploy (würde die Env überschreiben):
          # fehlt ein Kern-Secret, bricht der Deploy hier ab statt zu wischen.
          #
          # DIGGY_IMAGE gehört dazu: ohne den Digest würde die Compose auf
          # `latest` zurückfallen und der Rollout wieder stillschweigend
          # ausbleiben (siehe unten).
          : "${DIGGY_IMAGE:?fehlt — Digest aus dem publish-Job kam nicht an}"
          : "${SMTP_HOST:?fehlt — GitHub-Secret setzen, sonst wird die Stack-Env geleert}"
          : "${SMTP_USER:?fehlt — GitHub-Secret setzen}"
          : "${SMTP_PASS:?fehlt — GitHub-Secret setzen}"
          : "${CONTACT_TO:?fehlt — GitHub-Secret setzen}"
          : "${CONTACT_FROM:?fehlt — GitHub-Secret setzen}"
          : "${CONTACT_FORM_SECRET:?fehlt — GitHub-Secret setzen}"

          umask 077
          # Aufräumen auch bei Abbruch: `rm` am Ende des Skripts läuft bei
          # einem Fehler in `mw stack deploy` nicht mehr, die Datei mit allen
          # Secrets bliebe dann im Workspace liegen.
          trap 'rm -f runtime.env' EXIT
          {
            echo "SMTP_HOST=${SMTP_HOST}"
            echo "SMTP_PORT=${SMTP_PORT}"
            echo "SMTP_SECURE=${SMTP_SECURE}"
            echo "SMTP_USER=${SMTP_USER}"
            echo "SMTP_PASS=${SMTP_PASS}"
            echo "CONTACT_TO=${CONTACT_TO}"
            echo "CONTACT_FROM=${CONTACT_FROM}"
            echo "CONTACT_FORM_SECRET=${CONTACT_FORM_SECRET}"
            echo "PUBLIC_ORIGIN=${PUBLIC_ORIGIN}"
            echo "DIGGY_IMAGE=${DIGGY_IMAGE}"
            echo "PAGESPEED_API_KEY=${PAGESPEED_API_KEY}"
            echo "VIRUS_TOTAL_API_KEY=${VIRUS_TOTAL_API_KEY}"
          } > runtime.env

          mw stack deploy \
            --token "$MITTWALD_API_TOKEN" \
            --stack-id "$MITTWALD_STACK_ID" \
            --compose-file compose.mittwald.yml \
            --env-file runtime.env

          rm -f runtime.env
