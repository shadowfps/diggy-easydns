version: 2

# Nach dem Audit eingeführt: dort hatten sich 2 kritische und 5 hohe CVEs
# angesammelt, weil niemand hingesehen hat. Dependabot hält das sichtbar.
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # vite und sein React-Plugin MÜSSEN zusammen wandern, auch als Major.
      # Sie hängen über peerDependencies aneinander, und zwar in beide
      # Richtungen: plugin-react 4 verlangt `vite <=7`, plugin-react 6
      # verlangt `vite ^8`. Einzeln gehoben scheitert deshalb jeder von beiden
      # schon an `npm ci` (ERESOLVE) — so entstanden die roten PRs #47 und
      # #48, die sich gegenseitig blockierten. Diese Gruppe steht VOR
      # patch-and-minor, weil Dependabot die erste passende nimmt.
      vite:
        patterns: ['vite', '@vitejs/*']

      # Patch- und Minor-Updates gebündelt: einzeln sind das zu viele PRs, und
      # sie werden ohnehin zusammen gemergt.
      patch-and-minor:
        patterns: ['*']
        update-types: [minor, patch]
    # Majors bleiben absichtlich UNGRUPPIERT: sie fallen dadurch als einzelne
    # PRs an und bekommen die Aufmerksamkeit, die sie brauchen. Der
    # vite-8-Versuch aus #32 ist das Beispiel — er wechselt den Bundler auf
    # Rolldown und bricht den Build.
    ignore:
      # Die Typen müssen zur Laufzeit passen, und die ist Node 22 (Dockerfile,
      # CI). @types/node 26 (#61) hätte APIs angeboten, die es dort nicht
      # gibt. Hochziehen zusammen mit dem Node-Image, nicht vorher.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # typescript-eslint verlangt `typescript <6.1.0`, TS 7 scheitert schon
      # an `npm ci` (#59). Raus, sobald typescript-eslint 7 im Peer-Bereich hat.
      - dependency-name: 'typescript'
        versions: ['>=6.1.0']

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
