<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/diggy-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diggy — DNS made friendly. Comprehensive DNS, SSL & domain audits in one place." />
    <meta name="theme-color" content="#09090B" />

    <!-- Schriften kommen lokal aus dem Bundle, siehe src/styles/globals.css -->

    <!--
      Theme VOR dem ersten Paint setzen.

      Vorher stand class="dark" fest im html-Tag und useTheme korrigierte es
      erst in einem useEffect, also nach dem Mount der Header-Komponente:
      jeder Light-Mode-Nutzer sah bei jedem Aufruf ein dunkles Aufblitzen, auf
      langsamen Verbindungen umso länger. theme-color war ebenfalls fest dunkel.

      Das Script ist absichtlich blockierend und inline — eine eigene Datei
      wäre ein zusätzlicher Roundtrip vor dem Paint. Der Server nimmt den
      SHA-256 dieses Blocks beim Start aus dem gebauten HTML und trägt ihn in
      die CSP ein (server/index.ts), damit script-src 'self' bleiben kann.
    -->
    <script>
      try {
        var stored = localStorage.getItem('diggy-theme');
        var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', dark ? '#09090B' : '#FAFAFA');
      } catch (e) {
        /* localStorage kann in privaten Fenstern werfen — dann bleibt der
           Light-Default aus globals.css stehen. */
      }
    </script>

    <title>diggy — DNS made friendly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
