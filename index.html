<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/diggy-icon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Diggy — DNS made friendly. Comprehensive DNS, SSL & domain audits in one place." />
    <meta name="theme-color" content="#0D101A" />

    <!-- Schriften kommen lokal aus dem Bundle, siehe src/styles/fonts.css -->

    <!--
      Theme VOR dem ersten Paint setzen.

      Flow schaltet Hell/Dunkel über `data-theme` am html-Element. Gesetzt wird
      hier dasselbe, was useTheme später setzt — sonst blitzte bis zum Mount
      der App das falsche Theme auf.

      Das Script ist absichtlich blockierend und inline — eine eigene Datei
      wäre ein zusätzlicher Roundtrip vor dem Paint. Der Server nimmt den
      SHA-256 dieses Blocks beim Start aus dem gebauten HTML und trägt ihn in
      die CSP ein (server/index.ts), damit script-src 'self' bleiben kann.
    -->
    <script>
      try {
        var stored = localStorage.getItem('diggy-theme');
        var dark = stored === 'dark' || (!stored && matchMedia('(prefers-color-scheme: dark)').matches);
        document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        var meta = document.querySelector('meta[name=theme-color]');
        if (meta) meta.setAttribute('content', dark ? '#0D101A' : '#F4F8FC');
      } catch (e) {
        /* localStorage kann in privaten Fenstern werfen — ohne data-theme
           folgt Flow dann von selbst der Systemeinstellung. */
      }
    </script>

    <!--
      Englisches Wörterbuch früh anstoßen (#86).

      Englische Besucher rendern erst, wenn src/i18n/en.ts da ist (main.tsx).
      Ohne diesen Block holt die App den Chunk erst, nachdem index.js samt
      React geladen und ausgeführt ist — eine Runde mehr, auf "Fast 3G"
      gemessen 0,65 s leere Seite gegenüber Deutsch. So lädt er parallel.

      Gleiche Regel wie detectLanguage() in src/i18n/index.ts: gespeicherte
      Wahl, sonst die erste unterstützte Browser-Sprache, sonst Englisch.
      Ändert sich die eine, die andere mitziehen (i18n.test.ts vergleicht
      beide). Den Dateinamen setzt der Build ein (vite.config.ts); der
      CSP-Hash folgt wie beim Theme-Script von selbst.
    -->
    <script>
      (function () {
        var language = null;
        try {
          var stored = localStorage.getItem('diggy-language');
          if (stored === 'de' || stored === 'en') language = stored;
        } catch (e) {
          /* Ohne Storage zählt der Browser. */
        }
        var tags = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
        for (var i = 0; !language && i < tags.length; i++) {
          var base = String(tags[i] || '').toLowerCase().split('-')[0];
          if (base === 'de' || base === 'en') language = base;
        }
        if (language === 'de') return;
        var link = document.createElement('link');
        link.rel = 'modulepreload';
        link.crossOrigin = '';
        link.href = '__DIGGY_EN_CHUNK__';
        document.head.appendChild(link);
      })();
    </script>

    <title>diggy — DNS made friendly</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
